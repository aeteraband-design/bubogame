<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUBOGAME</title>
<style>html,body{margin:0;height:100%;background:#07010f}</style>
</head>
<body>
<script>
// Постоянная ссылка: этот файл не меняется. Номер версии берём из version.json (без кэша) и грузим актуальный app.html.
(function () {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('version ' + r.status); return r.json(); })
        .then(function (j) {
            return fetch('app.html?v=' + encodeURIComponent(j.v), { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error('app ' + r.status); return r.text(); });
        })
        .then(function (html) { document.open(); document.write(html); document.close(); })
        .catch(function (e) { document.body.textContent = 'Ошибка загрузки: ' + e.message; });
})();
</script>
</body>
</html>
